#spring.application.name=post-service
spring.application.name=travelSearch
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://mysql-container:3306/travel
spring.datasource.username=root
spring.datasource.password=SithijaSQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.http.multipart.max-file-size=10MB
#spring.http.multipart.max-request-size=11MB

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

bezkoder.app.jwtSecret= bezKoderSecretKey
bezkoder.app.jwtExpirationMs= 86400000
spring.main.allow-circular-references=true

external.user-service.base-url=http://user-service:8082

#spring.config.import=consul:
#spring.cloud.consul.host=localhost
#spring.cloud.consul.port=8500
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.default-context=travelSearch

spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.redis.cache-null-values=${SPRING_CACHE_REDIS_CACHE_NULL_VALUES:true}
spring.cache.redis.time-to-live=${SPRING_CACHE_REDIS_TIME_TO_LIVE:3600000}